[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-runtime"
version = "0.1.0rc1"
description = "Guardian-gated, non-executing governed-kernel release candidate for LIMA Runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "SparkPit Labs" }
]

[tool.setuptools]
packages = [
  "lima",
  "lima.contracts",
  "lima.governed_kernel",
]

[tool.pytest.ini_options]
norecursedirs = [
  ".pytest_cache",
  "pytest-cache-files-*",
]
