[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-runtime"
version = "0.0.1"
description = "Phase 0 contracts for the LIMA Runtime / LIMA Kernel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0,<3.0.0",
]
license = { file = "LICENSE" }
authors = [
  { name = "SparkPit Labs" }
]

[tool.setuptools.packages.find]
include = ["lima*"]

[tool.pytest.ini_options]
norecursedirs = [
  ".pytest_cache",
  "pytest-cache-files-*",
]
