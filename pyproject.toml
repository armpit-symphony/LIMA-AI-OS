[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-runtime"
version = "0.0.1"
description = "Phase 0 contracts for the LIMA Runtime / LIMA Kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "SparkPit Labs" }
]

[tool.setuptools.packages.find]
include = ["lima*"]
