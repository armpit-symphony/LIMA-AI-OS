name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall lima tests
      - name: Tests
        run: pytest -q
      - name: Installed Arc consumer fake-executor proof
        run: python scripts/prove_arc_consumer_baseline.py
